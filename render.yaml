services:
  - type: web
    name: srinivasan-mart
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "8080"
      # PGHOST / PGPORT / PGDATABASE / PGUSER / PGPASSWORD / DATABASE_URL
      # are injected automatically by Render because this blueprint also
      # provisions the srinivasan-mart-db PostgreSQL instance below.
databases:
  - name: srinivasan-mart-db
    plan: free
    databaseName: sri_mart
